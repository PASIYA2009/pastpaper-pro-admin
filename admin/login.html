<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login - PastPaper Pro</title><link rel="stylesheet" href="style.css"></head><body><div class="auth-wrap"><div class="auth-card"><div class="logo">PastPaper <span>Pro</span> Admin</div><h1>Admin Login</h1><p id="err" class="alert" style="display:none"></p><form id="login"><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input type="password" name="password" autocomplete="current-password" required><button class="btn full">Login</button></form></div></div><script>login.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(login));const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(r.ok)location.href='/';else{err.style.display='block';err.textContent='Invalid username or password.'}}</script></body></html>
