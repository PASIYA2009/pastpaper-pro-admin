<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PastPaper Pro Admin</title><link rel="stylesheet" href="style.css"></head><body><header class="navbar"><div class="logo">PastPaper <span>Pro</span> Admin</div><nav><a href="javascript:showAdd()">Add Paper</a><a href="javascript:logout()">Logout</a></nav></header><section class="container page"><div class="section-head"><div><h1>Admin Dashboard</h1><p>GitHub-backed paper manager — no MySQL database.</p></div><button class="btn" onclick="showAdd()">+ Add Paper</button></div><div class="stats"><div class="stat"><strong id="total">0</strong><span>Total Papers</span></div><div class="stat"><strong id="ol">0</strong><span>O/L</span></div><div class="stat"><strong id="al">0</strong><span>A/L</span></div></div><div class="table-wrap"><table><thead><tr><th>Title</th><th>Exam</th><th>Year</th><th>Subject</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></section><div id="modal" style="display:none" class="auth-wrap"><div class="form-card"><h1 id="formTitle">Add New Paper</h1><form id="paperForm"><input type="hidden" name="id"><label>Paper title *</label><input name="title" required><label>Exam *</label><select name="exam_type"><option value="OL">O/L</option><option value="AL">A/L</option></select><label>Year *</label><input type="number" name="year" min="1900" max="2100" required><label>Subject *</label><input name="subject" required><label>Language *</label><input name="language" placeholder="Sinhala / English / Tamil" required><label>Category</label><input name="category" value="Past Paper"><label>Paper URL *</label><input type="url" name="download_url" placeholder="https://..." required><p id="err" class="alert" style="display:none"></p><button class="btn" type="submit">Save Paper</button> <button class="btn btn-outline" type="button" onclick="closeModal()">Cancel</button></form></div></div><script src="app.js"></script></body></html>
